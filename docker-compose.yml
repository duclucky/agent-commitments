services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: agent_commitments
      POSTGRES_USER: agent_commitments
      POSTGRES_PASSWORD: agent_commitments
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_commitments -d agent_commitments"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - agent_commitments_pg:/var/lib/postgresql/data

volumes:
  agent_commitments_pg:
